<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Top box: .nvmrc -->
  <rect x="55" y="20" width="610" height="80" rx="12" fill="#1e3a5f" filter="url(#shadow)"/>
  <text x="360" y="55" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">.nvmrc (24.13.0)</text>
  <text x="360" y="80" text-anchor="middle" fill="#94b8d9" font-size="14">(Single Source of Truth)</text>

  <!-- Arrow 1: to Developer (center x=150) -->
  <line x1="150" y1="100" x2="150" y2="180" stroke="#64748b" stroke-width="2"/>
  <polygon points="143,176 150,192 157,176" fill="#64748b"/>

  <!-- Arrow 2: to Yarn Plugin (center x=360) -->
  <line x1="360" y1="100" x2="360" y2="180" stroke="#64748b" stroke-width="2"/>
  <polygon points="353,176 360,192 367,176" fill="#64748b"/>

  <!-- Arrow 3: to CI/CD (center x=570) -->
  <line x1="570" y1="100" x2="570" y2="180" stroke="#64748b" stroke-width="2"/>
  <polygon points="563,176 570,192 577,176" fill="#64748b"/>

  <!-- Bottom box 1: Developer (x=55, w=190, center=150) -->
  <rect x="55" y="200" width="190" height="110" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="55" y="200" width="190" height="38" rx="12" fill="#3b82f6"/>
  <rect x="55" y="220" width="190" height="18" fill="#3b82f6"/>
  <text x="150" y="225" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">&#xAC1C;&#xBC1C;&#xC790;</text>
  <text x="150" y="265" text-anchor="middle" fill="#334155" font-size="14" font-weight="600">nvm use</text>
  <text x="150" y="290" text-anchor="middle" fill="#64748b" font-size="13">(&#xC218;&#xB3D9;)</text>

  <!-- Bottom box 2: Yarn Plugin (x=265, w=190, center=360) -->
  <rect x="265" y="200" width="190" height="110" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="265" y="200" width="190" height="38" rx="12" fill="#10b981"/>
  <rect x="265" y="220" width="190" height="18" fill="#10b981"/>
  <text x="360" y="225" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Yarn Plugin</text>
  <text x="360" y="265" text-anchor="middle" fill="#334155" font-size="14" font-weight="600">validateProject</text>
  <text x="360" y="290" text-anchor="middle" fill="#64748b" font-size="13">(&#xC790;&#xB3D9; &#xAC15;&#xC81C;)</text>

  <!-- Bottom box 3: CI/CD (x=475, w=190, center=570) -->
  <rect x="475" y="200" width="190" height="110" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="475" y="200" width="190" height="38" rx="12" fill="#8b5cf6"/>
  <rect x="475" y="220" width="190" height="18" fill="#8b5cf6"/>
  <text x="570" y="225" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">CI/CD</text>
  <text x="570" y="265" text-anchor="middle" fill="#334155" font-size="14" font-weight="600">setup-node</text>
  <text x="570" y="290" text-anchor="middle" fill="#64748b" font-size="13">(&#xC790;&#xB3D9;)</text>
</svg>
